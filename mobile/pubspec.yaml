name: jalmeco_gps
description: "Jalmeco GPS — app del trabajador (rastreo de jornada, Android)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

# Versiones fijas (sin ^) a propósito: ver CLAUDE.md → Convenciones.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:           # textos del sistema en español
    sdk: flutter
  cupertino_icons: 1.0.8
  http: 1.6.0                      # llamadas a la API del backend
  flutter_secure_storage: 10.3.4   # tokens de sesión cifrados
  device_info_plus: 12.4.0         # marca/modelo del equipo
  android_id: 0.5.2+1              # identificador del equipo (alerta cambio_equipo)
  permission_handler: 12.0.1       # ubicación, notificaciones, batería
  flutter_foreground_task: 9.2.2    # servicio en primer plano (rastreo)
  geolocator: 14.0.2               # GPS
  sqflite: 2.4.2                   # cola offline de puntos
  battery_plus: 7.1.2              # nivel de batería en cada punto
  path: 1.9.1                      # rutas de archivos (SQLite)
  local_auth: 2.3.0                # huella (verificación de identidad)
  flutter_local_notifications: 20.1.0  # aviso "Confirma tu identidad" (alta prioridad)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  flutter_launcher_icons: 0.14.4   # genera el ícono: dart run flutter_launcher_icons

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

# Ícono de la app (logo con su fondo azul marino)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icono/logo_icono.png
  adaptive_icon_background: "#1C1C62"
  adaptive_icon_foreground: assets/icono/logo_adaptativo.png
  min_sdk_android: 26
